name: Supabase Keep-Alive (Todos los Proyectos)

# Mantiene activos TODOS los proyectos de Supabase de Lilliana Retana Tech.
# Supabase pausa proyectos del plan gratuito después de 7 días sin actividad.
# Este workflow consulta una TABLA REAL de cada proyecto (no la raíz genérica,
# que requiere permisos de administrador), 2 veces por semana.
#
# Para AGREGAR un proyecto nuevo: copie un bloque "- name:" dentro de la
# matriz de abajo y cambie nombre, url, key y table (nombre de cualquier
# tabla real que exista en ese proyecto).
# Para QUITAR uno: borre su bloque correspondiente.

on:
  schedule:
    - cron: '0 12 * * 1,3,5'   # Lunes, miércoles y viernes, 12:00 UTC (6:00 am hora CR)
  workflow_dispatch:          # Permite ejecutarlo manualmente desde GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # Si un proyecto falla, los demás igual se revisan
