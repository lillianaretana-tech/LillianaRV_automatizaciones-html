name: Supabase Keep-Alive (Todos los Proyectos)

# Mantiene activos TODOS los proyectos de Supabase de Lilliana Retana Tech.
# Supabase pausa proyectos del plan gratuito después de 7 días sin actividad.
# Este workflow hace una consulta real a cada proyecto, 2 veces por semana,
# para que ninguno se acerque jamás a ese límite.
#
# Para AGREGAR un proyecto nuevo: copie un bloque "- name:" dentro de la
# matriz de abajo y cambie nombre, url y key.
# Para QUITAR uno: borre su bloque correspondiente.

on:
  schedule:
    - cron: '0 12 * * 1,4'   # Lunes y jueves, 12:00 UTC (6:00 am hora CR)
  workflow_dispatch:          # Permite ejecutarlo manualmente desde GitHub

